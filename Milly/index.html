<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>

<title>Byte & Bun</title>

<link rel="stylesheet" href="style.css"/>
</head>

<body>

<h1>Byte & Bun</h1>

<section>

<h2>Exercício 1 - Console</h2>

<p class="explicacao"> Sem elemento visual: Confira a aba do console F12 ao carregar a página.</p>

</section>

<section>
    <h2> Exercicio 2 - Mudando o texto da página</h2>
    <button id="btnSaudacao">Entrar</button>
    <p id="mensagem"></p>
    <img id="print">
</section>

<section>
    <h2>Exercício 3 - Exibindo um preço do cardapio</h2>
    <button id="btnIntegral">Pão Integral</button>
    <button id="btnFrances">Pão Francês</button>
    <button id="btnCiabatta">Pão ciabatta</button>
    <img id="print2" width="500px">
    <p id="resultado"></p>
</section>

<section>
    <h2>Exercicio 4 - Lendo o valor digitado</h2>
    <input type="number" id="quantidade" min="0" placeholder="Digite a quantidade:"/>
    <button id="btnCalcular">Calcular</button>
    <p id="total"></p>
</section>

<script src="script.js"></script>

</body>

</html>
